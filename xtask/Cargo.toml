[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ar = "0.9"
bollard = "0.21"
diffy = "0.5"
flate2 = "1"
futures-util = "0.3"
rpm = { version = "0.30", default-features = false, features = ["payload", "zstd-compression"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tokio = { version = "1", features = ["rt"] }
toml = "1"
ureq = "3"
zstd = "0.14"

# zstd compresses the RPM and pacman payloads at a high level; unoptimized it takes over a minute per package.
[profile.dev.package."*"]
opt-level = 3
